name: UI tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps

      - name: Run Playwright tests with pytest and generate Allure results
        run: |
          pytest -m regression --alluredir=allure-results

      # Восстанавливаем историю покрытия из кеша
      - name: Restore Coverage history
        uses: actions/cache/restore@v4
        with:
          path: coverage-history.json
          key: coverage-history-${{ github.run_id }}
          restore-keys: |
            coverage-history-

      # Генерируем HTML-отчет и обновляем историю
      - name: Generate Coverage report
        run: |
          ui-coverage-tool save-report

      # Сохраняем историю обратно в кеш
      - name: Cache Coverage  history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: coverage-history.json
          key: coverage-history-${{ github.run_id }}

      # Загружаем HTML-отчет как артефакт
      - name: Upload Coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.html

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results


  publish-report:
    if: always()
    needs: [ run-tests ]
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем основной код проекта
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Выкачиваем ветку деплоя gh-pages в отдельную папку (продолжаем при ошибке, если ветки еще нет)
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-dir # Скачается в папку gh-pages-dir

      # 3. Скачиваем сгенерированные результаты тестов из первой джобы
      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      # 4. Устанавливаем Java (она строго обязательна для работы этого экшена)
      - name: Set up JDK
        uses: actions/setup-python@v4 # (вы можете использовать setup-java, ubuntu-latest уже имеет Java, но лучше настроить явно)
        # На ubuntu-latest обычно Java уже есть, но если что, экшен её подхватит.

      # 5. Генерируем Allure Report с правильными параметрами для mgrybyk экшена
      - name: Generates Allure Report with history
        uses: mgrybyk-org/allure-report-branch-js-action@v1
        if: always()
        with:
          report_dir: allure-results   # Папка с результатами тестов
          gh_pages: gh-pages-dir       # Папка, куда мы сделали checkout ветки gh-pages
          report_id: allure-report     # Название подпапки для отчета

      # 6. Публикуем сгенерированный отчет в GitHub Pages
      - name: Deploy report to Github Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          # Экшен mgrybyk обновляет файлы прямо внутри папки, которую мы ему передали (gh-pages-dir)
          publish_dir: ./gh-pages-dir